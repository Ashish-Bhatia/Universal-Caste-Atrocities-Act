name: Control Text Synchronization 2026-09-06

on:
  push:
    branches:
      - remediation/website-2026-09-06

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Synchronize control text
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          p=root/'README.md'; s=p.read_text(encoding='utf-8')
          s=re.sub(r'33 of 36 States/UTs have substantive inventories','36 of 36 States/UTs have substantive inventories',s)
          s=s.replace('- Remaining unresearched jurisdictions: Ladakh, Lakshadweep and Puducherry\n','- Remaining unresearched jurisdictions: none\n- Central-law, transition and currentness residuals remain open.\n')
          p.write_text(s,encoding='utf-8')

          p=root/'project-state/PH1_STATE_CONTROL_RECONCILIATION_2026-09-06.md'; s=p.read_text(encoding='utf-8')
          if not s.startswith('> HISTORICAL CONTROL RECORD'):
              s='> HISTORICAL CONTROL RECORD: superseded for current State/UT count by the 2026-09-06 cumulative Phase 1 acceptance audit and current inventory.\n\n'+s
          p.write_text(s,encoding='utf-8')

          p=root/'ISSUES_REGISTER.md'; s=p.read_text(encoding='utf-8')
          s=re.sub(r'(\| PH1-ISSUE-001 \|[^\n]*?\| )OPEN( \|)',r'\1CLOSED WITH QUALIFICATION\2',s,count=1)
          s=re.sub(r'(\| PH1-ISSUE-014 \|[^\n]*?\| )OPEN( \|)',r'\1CLOSED\2',s,count=1)
          p.write_text(s,encoding='utf-8')

          p=root/'DECISIONS_LOG.md'; s=p.read_text(encoding='utf-8')
          marker='## Central Transition Decision Index 2026-09-06'
          if marker not in s:
              s+='\n\n'+marker+'\n\nIndexed from `project-state/CONTROL_DECISIONS_CENTRAL_TRANSITION_2026-09-06.md`: DEC-CENTRAL-2026-09-06-001, DEC-CENTRAL-2026-09-06-002, DEC-CENTRAL-2026-09-06-003, DEC-CENTRAL-2026-09-06-004. Detailed reasoning remains in the dated control record.\n'
          p.write_text(s,encoding='utf-8')

      - name: Remove workflow and commit
        run: |
          git rm -f .github/workflows/control-text-sync-2026-09-06.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "control: synchronize current-state records"
          git push
