name: Isolated Website Remediation 2026-09-06

on:
  push:
    branches:
      - remediation/website-2026-09-06

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply controlled remediation
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')

          p=root/'scripts/build_website_v2.py'
          s=p.read_text(encoding='utf-8')
          start=s.index('def md_html(text):')
          end=s.index('def strip_controls', start)
          new='''def md_html(text):
              out=[]; para=[]; bullets=[]
              def fp():
                  nonlocal para
                  if para: out.append(f"<p>{md_inline(' '.join(para))}</p>"); para=[]
              def fb():
                  nonlocal bullets
                  if bullets: out.append("<ul>"+"".join(f"<li>{md_inline(x)}</li>" for x in bullets)+"</ul>"); bullets=[]
              def table_block(block):
                  rows=[]
                  for line in block:
                      cells=[c.strip() for c in line.strip().strip('|').split('|')]
                      if cells: rows.append(cells)
                  if len(rows)<2: return None
                  header=rows[0]; separator=rows[1]
                  is_sep=all(re.fullmatch(r':?-{3,}:?', c.replace(' ','')) for c in separator)
                  body=rows[2:] if is_sep else rows[1:]
                  html_out=['<div class="tablewrap"><table class="table"><thead><tr>']
                  html_out.extend(f"<th>{md_inline(c)}</th>" for c in header)
                  html_out.append('</tr></thead><tbody>')
                  for row in body:
                      html_out.append('<tr>')
                      html_out.extend(f"<td>{md_inline(row[i] if i<len(row) else '')}</td>" for i in range(len(header)))
                      html_out.append('</tr>')
                  html_out.append('</tbody></table></div>')
                  return ''.join(html_out)
              lines=text.splitlines(); i=0
              while i<len(lines):
                  s=lines[i].strip()
                  if s.startswith('|') and s.endswith('|') and i+1<len(lines) and re.fullmatch(r'\\|?\\s*:?-{3,}:?\\s*(\\|\\s*:?-{3,}:?\\s*)+\\|?', lines[i+1].strip()):
                      fp(); fb(); block=[lines[i],lines[i+1]]; i+=2
                      while i<len(lines) and lines[i].strip().startswith('|') and lines[i].strip().endswith('|'):
                          block.append(lines[i]); i+=1
                      rendered=table_block(block)
                      if rendered: out.append(rendered)
                      continue
                  if not s: fp(); fb(); i+=1; continue
                  if s.startswith('# '): fp(); fb(); out.append(f"<h2>{md_inline(s[2:])}</h2>"); i+=1; continue
                  if s.startswith('## '): fp(); fb(); t=s[3:]; out.append(f'<h2 id="{slug(t)}">{md_inline(t)}</h2>'); i+=1; continue
                  if s.startswith('### '): fp(); fb(); out.append(f"<h3>{md_inline(s[4:])}</h3>"); i+=1; continue
                  m=re.match(r'^[-*]\\s+(.*)$',s)
                  if m: fp(); bullets.append(m.group(1)); i+=1; continue
                  m=re.match(r'^\\d+\\.\\s+(.*)$',s)
                  if m: fp(); bullets.append(m.group(1)); i+=1; continue
                  para.append(s); i+=1
              fp(); fb(); return "\\n".join(out)

          '''
          s=s[:start]+new+s[end:]
          s=s.replace('states=inventory(); completed=[x for x in states if "NOT STARTED" not in x[1]]', 'states=inventory(); completed=[x for x in states if "NOT STARTED" not in x[1]]; total=len(states); completed_count=len(completed)')
          s=s.replace('shell("Research home","",\'<section class="hero-grid">', 'shell("Research home","",f\'<section class="hero-grid">')
          s=s.replace('<div class="hero-number">33<span>/36</span></div>', '<div class="hero-number">{completed_count}<span>/{total}</span></div>')
          s=s.replace('<div class="panel-note">Three jurisdictions remain outside the completed sequence. The public library does not treat this as a policy or constitutional conclusion.</div>', '<div class="panel-note">{total - completed_count} jurisdiction(s) remain outside the completed sequence. The public library does not treat this as a policy or constitutional conclusion.</div>')
          if '33<span>/36</span>' in s: raise SystemExit('hard-coded hero count remains')
          p.write_text(s,encoding='utf-8')

          p=root/'.devcontainer/devcontainer.json'; s=p.read_text(encoding='utf-8').replace('python3 scripts/build_website.py','python3 scripts/build_website_v2.py'); p.write_text(s,encoding='utf-8')
          p=root/'.github/workflows/pages.yml'; s=p.read_text(encoding='utf-8').replace('python3 scripts/build_website.py','python3 scripts/build_website_v2.py'); p.write_text(s,encoding='utf-8')

          p=root/'.gitignore'; existing=p.read_text(encoding='utf-8') if p.exists() else ''; rules='website/*.html\\nwebsite/states/\\nwebsite/law/\\nwebsite/sources/\\nwebsite/robots.txt\\nwebsite/sitemap.xml\\n';
          if 'website/*.html' not in existing: p.write_text(existing.rstrip()+'\\n\\n# Generated GitHub Pages output\\n'+rules,encoding='utf-8')
          import shutil
          for x in list((root/'website').glob('*.html'))+[(root/'website'/'robots.txt'),(root/'website'/'sitemap.xml')]: x.unlink(missing_ok=True)
          for d in [root/'website/states',root/'website/law',root/'website/sources']:
              if d.exists(): shutil.rmtree(d)

          p=root/'ISSUES_REGISTER.md'; s=p.read_text(encoding='utf-8')
          s=s.replace('| PH1-ISSUE-001 | SC/ST Act clause-level extraction and current-version verification were incomplete. | OPEN | Act baseline not yet frozen. | Final Gazette/Legislative Department index check and preserve clause extraction. |','| PH1-ISSUE-001 | SC/ST Act clause-level extraction and current-version verification were incomplete. | CLOSED WITH QUALIFICATION | Act current-text/version question is controlled-closed, while broader later-instrument completeness remains open under PH1-ISSUE-008. | Preserve the verified 21-09-2025 consolidated Act text; do not infer absence of later subordinate instruments. |')
          s=s.replace('| PH1-ISSUE-014 | Schedule item 43 cites a 2001 disability notification while attached Annexure-II material begins with a 1986 notification. | OPEN | Controlling Annexure-II source cannot be frozen. | Locate and verify operative Gazette/Department attachment. |','| PH1-ISSUE-014 | Schedule item 43 cites a 2001 disability notification while attached Annexure-II material begins with a 1986 notification. | CLOSED | The official Ministry-hosted Rules PDF identifies Annexure-II as the 01-06-2001 notification and treats the 1986 instrument as the earlier guideline reviewed by it. | Retain the resolution; broader final Rules source freeze remains under PH1-ISSUE-002. |')
          p.write_text(s,encoding='utf-8')

          p=root/'README.md'; s=p.read_text(encoding='utf-8'); s=re.sub(r'33/36','36/36',s); s=s.replace('Ladakh, Lakshadweep and Puducherry remain unresearched.','All 36 States/UTs now have substantive Phase 1 inventories. Central-law, transition and currentness residuals remain open.'); p.write_text(s,encoding='utf-8')
          p=root/'project-state/PH1_STATE_CONTROL_RECONCILIATION_2026-09-06.md'; s=p.read_text(encoding='utf-8'); s=s if s.startswith('> HISTORICAL CONTROL RECORD') else '> HISTORICAL CONTROL RECORD: superseded for current State/UT count by the 2026-09-06 cumulative Phase 1 acceptance audit and current inventory.\\n\\n'+s; p.write_text(s,encoding='utf-8')
          p=root/'DECISIONS_LOG.md'; s=p.read_text(encoding='utf-8'); marker='## Central Transition Decision Index 2026-09-06'; s=s if marker in s else s+'\\n\\n'+marker+'\\n\\nIndexed from `project-state/CONTROL_DECISIONS_CENTRAL_TRANSITION_2026-09-06.md`: DEC-CENTRAL-2026-09-06-001, DEC-CENTRAL-2026-09-06-002, DEC-CENTRAL-2026-09-06-003, DEC-CENTRAL-2026-09-06-004. Detailed reasoning remains in the dated control record.\\n'; p.write_text(s,encoding='utf-8')

      - name: Validate builder and control files
        run: |
          python3 -m py_compile scripts/build_website_v2.py
          ! grep -q '33<span>/36</span>' scripts/build_website_v2.py
          ln -sf DELHI.md legislation/states/DELHI_NCT.md

      - name: Build and audit generated site
        run: |
          python3 scripts/build_website_v2.py
          python3 scripts/sync_phase1_website.py
          python3 scripts/verify_pages_rendering_controls.py
          python3 scripts/sanitize_public_html.py
          python3 scripts/validate_public_site.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=sorted(Path('website').rglob('*.html'))
          assert len(files)==90, len(files)
          bad=[]
          for p in files:
              h1=len(re.findall(r'<h1\\b',p.read_text(encoding='utf-8'),re.I))
              if h1!=1: bad.append((str(p),h1))
          assert not bad,bad[:10]
          text='\\n'.join(p.read_text(encoding='utf-8') for p in files)
          assert '33/36' not in text
          assert '36<span>/36</span>' in text
          assert len(list(Path('website/states').glob('*.html')))==36
          assert len(list(Path('website/sources').glob('*.html')))==36
          print('90-page remediation audit PASS')
          PY

      - name: Commit remediation and remove workflow
        run: |
          rm -f legislation/states/DELHI_NCT.md
          git rm -f .github/workflows/branch-remediation-2026-09-06.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "control: remediate website source and build architecture"
          git push
