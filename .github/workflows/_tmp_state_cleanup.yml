name: One-time Phase 1 state cleanup
on:
  push:
    branches: [main]
    paths: [project-state/state-cleanup.trigger]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('PROJECT_STATE.md'); s=p.read_text(); s=s.replace('Jammu and Kashmir, Ladakh, Lakshadweep.','Jammu and Kashmir, Ladakh, Lakshadweep, Puducherry.'); s=s.replace('Master State Implementation Inventory reconciliation: COMPLETE through Lakshadweep substantive artifact addition.','Master State Implementation Inventory reconciliation: COMPLETE through Puducherry substantive artifact addition.'); p.write_text(s)
          p=Path('NEXT_CHAT.md'); s=p.read_text(); s=s.replace('Before beginning Puducherry:\n1. Read `PROJECT_STATE.md`.\n2. Read `NEXT_CHAT.md`.\n3. Read `project-state/PH1_CONTROL_MATRIX_2026-09-06.md`.\n4. Read current `ISSUES_REGISTER.md` and `DECISIONS_LOG.md` for the cumulative control position.\n5. Read the completed-jurisdiction artifacts only if needed to preserve methodology or control boundaries. Do not repeat their substantive research.\n6. Preserve the exact 377-ID source-ledger discrepancy and do not alter the master source ledger for website synchronization.','Before beginning the cumulative Phase 1 acceptance audit:\n1. Read `PROJECT_STATE.md`.\n2. Read `NEXT_CHAT.md`.\n3. Read `project-state/PH1_CONTROL_MATRIX_2026-09-06.md`.\n4. Read current `ISSUES_REGISTER.md` and `DECISIONS_LOG.md`.\n5. Read the 36 jurisdiction control records only as needed to reconcile acceptance criteria. Do not repeat completed substantive research.\n6. Preserve the exact 377-ID source-ledger discrepancy and do not alter the master source ledger for website synchronization.')
          s=s.replace('Continue the Universal Caste Atrocities Act project from the completed 2026-09-06 Lakshadweep Phase 1 stopping point.','Continue the Universal Caste Atrocities Act project from the completed 2026-09-06 Puducherry Phase 1 stopping point.')
          s=s.replace('First read `PROJECT_STATE.md`, `NEXT_CHAT.md`, `project-state/PH1_CONTROL_MATRIX_2026-09-06.md`, `ISSUES_REGISTER.md`, `DECISIONS_LOG.md`, and the Lakshadweep artifacts `legislation/states/LAKSHADWEEP.md`, `research/states/LAKSHADWEEP_SOURCE_LEDGER.md`, `project-state/LAKSHADWEEP_ISSUES_2026-09-06.md` and `project-state/LAKSHADWEEP_DECISIONS_2026-09-06.md`.','First read `PROJECT_STATE.md`, `NEXT_CHAT.md`, `project-state/PH1_CONTROL_MATRIX_2026-09-06.md`, `ISSUES_REGISTER.md`, `DECISIONS_LOG.md`, and the Puducherry artifacts `legislation/states/PUDUCHERRY.md`, `research/states/PUDUCHERRY_SOURCE_LEDGER.md`, `project-state/PUDUCHERRY_ISSUES_2026-09-06.md` and `project-state/PUDUCHERRY_DECISIONS_2026-09-06.md`.')
          s=s.replace('Lakshadweep is complete for its defined first-pass inventory and classified PROCEED/CLOSE WITH LIMITATIONS. Preserve its 18 open residuals. Do not repeat Lakshadweep unless the formal reopening rule is met. The next authorized workstream is cumulative Phase 1 acceptance audit and reconciliation. Puducherry research is complete for its defined first-pass inventory.','Puducherry is complete for its defined first-pass inventory and classified PROCEED/CLOSE WITH LIMITATIONS. Preserve its 16 open residuals. Do not repeat Puducherry unless the formal reopening rule is met. The next authorized workstream is cumulative Phase 1 acceptance audit and reconciliation.')
          p.write_text(s)
          p=Path('project-state/state-cleanup.trigger'); p.unlink(); Path('.github/workflows/_tmp_state_cleanup.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add PROJECT_STATE.md NEXT_CHAT.md; git rm project-state/state-cleanup.trigger .github/workflows/_tmp_state_cleanup.yml; git commit -m 'Finalize Phase 1 completion handoff'; git push origin main
