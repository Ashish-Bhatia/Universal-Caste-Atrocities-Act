name: Integrate State Source Ledger

on:
  push:
    branches:
      - main
    paths:
      - project-state/ledger-sync.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run controlled integration
        run: python3 scripts/integrate_state_source_ledger.py

      - name: Run independent zero-drift verification
        run: python3 scripts/verify_state_source_ledger_zero_drift.py

      - name: Validate reports
        run: |
          test -s research/STATE_IMPLEMENTATION_SOURCE_LEDGER.md
          grep -q "PASS\|NO-OP" project-state/PH1_MASTER_SOURCE_LEDGER_INTEGRATION_REPORT_2026-09-06.md
          grep -q "PASS" project-state/PH1_MASTER_SOURCE_LEDGER_ZERO_DRIFT_2026-09-06.md

      - name: Commit verification result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/STATE_IMPLEMENTATION_SOURCE_LEDGER.md project-state/PH1_MASTER_SOURCE_LEDGER_INTEGRATION_REPORT_2026-09-06.md project-state/PH1_MASTER_SOURCE_LEDGER_ZERO_DRIFT_2026-09-06.md
          if git diff --cached --quiet; then
            echo "No verification changes to commit"
          else
            git commit -m "Verify master source-ledger zero drift"
            git push origin main
          fi
