name: Controlled Website Remediation 2026-09-06

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  remediate-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare repository path compatibility
        run: ln -sf DELHI.md legislation/states/DELHI_NCT.md

      - name: Apply controlled remediation
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.').resolve()

          # 1. Make build_website_v2 self-sufficient for current counts, embedded headings and Markdown tables.
          p = root / 'scripts' / 'build_website_v2.py'
          s = p.read_text(encoding='utf-8')

          new_md_html = '''def md_html(text):
              out=[]; para=[]; bullets=[]
              def fp():
                  nonlocal para
                  if para: out.append(f"<p>{md_inline(' '.join(para))}</p>"); para=[]
              def fb():
                  nonlocal bullets
                  if bullets: out.append("<ul>"+"".join(f"<li>{md_inline(x)}</li>" for x in bullets)+"</ul>"); bullets=[]
              def table_block(block):
                  rows=[]
                  for line in block:
                      cells=[c.strip() for c in line.strip().strip('|').split('|')]
                      if cells: rows.append(cells)
                  if len(rows) < 2: return None
                  header=rows[0]
                  body=rows[2:] if len(rows) > 1 and all(re.fullmatch(r':?-{3,}:?', c.replace(' ', '')) for c in rows[1]) else rows[1:]
                  out=['<div class="tablewrap"><table class="table"><thead><tr>']
                  out.extend(f"<th>{md_inline(c)}</th>" for c in header)
                  out.append('</tr></thead><tbody>')
                  for row in body:
                      out.append('<tr>')
                      for i in range(len(header)):
                          out.append(f"<td>{md_inline(row[i] if i < len(row) else '')}</td>")
                      out.append('</tr>')
                  out.append('</tbody></table></div>')
                  return ''.join(out)
              lines=text.splitlines(); i=0
              while i < len(lines):
                  s=lines[i].strip()
                  if s.startswith('|') and s.endswith('|') and i+1 < len(lines) and re.fullmatch(r'\\|?\\s*:?-{3,}:?\\s*(\\|\\s*:?-{3,}:?\\s*)+\\|?', lines[i+1].strip()):
                      fp(); fb(); block=[lines[i], lines[i+1]]; i+=2
                      while i < len(lines) and lines[i].strip().startswith('|') and lines[i].strip().endswith('|'):
                          block.append(lines[i]); i+=1
                      rendered=table_block(block)
                      if rendered: out.append(rendered)
                      continue
                  if not s: fp(); fb(); i+=1; continue
                  if s.startswith('# '): fp(); fb(); out.append(f"<h2>{md_inline(s[2:])}</h2>"); i+=1; continue
                  if s.startswith('## '): fp(); fb(); t=s[3:]; out.append(f'<h2 id="{slug(t)}">{md_inline(t)}</h2>'); i+=1; continue
                  if s.startswith('### '): fp(); fb(); out.append(f"<h3>{md_inline(s[4:])}</h3>"); i+=1; continue
                  m=re.match(r'^[-*]\\s+(.*)$',s)
                  if m: fp(); bullets.append(m.group(1)); i+=1; continue
                  m=re.match(r'^\\d+\\.\\s+(.*)$',s)
                  if m: fp(); bullets.append(m.group(1)); i+=1; continue
                  para.append(s); i+=1
              fp(); fb(); return "\\n".join(out)
          '''
          s = re.sub(r'def md_html\(text\):.*?\ndef strip_controls', new_md_html + '\ndef strip_controls', s, flags=re.S)

          s = s.replace('states=inventory(); completed=[x for x in states if "NOT STARTED" not in x[1]]', 'states=inventory(); completed=[x for x in states if "NOT STARTED" not in x[1]]; total=len(states); completed_count=len(completed)')
          s = s.replace('shell("Research home","",\'<section class="hero-grid">', 'shell("Research home","",f\'<section class="hero-grid">')
          s = s.replace('<div class="hero-number">33<span>/36</span></div>', '<div class="hero-number">{completed_count}<span>/{total}</span></div>')
          s = s.replace('<div class="panel-note">Three jurisdictions remain outside the completed sequence. The public library does not treat this as a policy or constitutional conclusion.</div>', '<div class="panel-note">{total - completed_count} jurisdiction(s) remain outside the completed sequence. The public library does not treat this as a policy or constitutional conclusion.</div>')
          if '33<span>/36</span>' in s:
              raise SystemExit('hard-coded 33/36 remains in build_website_v2.py')
          p.write_text(s, encoding='utf-8')

          # 2. Codespaces must use the same production builder path as Pages.
          p = root / '.devcontainer' / 'devcontainer.json'
          s = p.read_text(encoding='utf-8')
          s = s.replace('python3 scripts/build_website.py', 'python3 scripts/build_website_v2.py && python3 scripts/sync_phase1_website.py && python3 scripts/verify_pages_rendering_controls.py && python3 scripts/validate_public_site.py')
          p.write_text(s, encoding='utf-8')

          # 3. Pages workflow must use the production builder and keep the synchronization step as a control check.
          p = root / '.github' / 'workflows' / 'pages.yml'
          s = p.read_text(encoding='utf-8').replace('python3 scripts/build_website.py', 'python3 scripts/build_website_v2.py')
          s = s.replace('# Rebuild after the Phase 1 heading-hierarchy control fix.', '# Production builder is the sole Pages build path. Count synchronization remains a validation control.')
          p.write_text(s, encoding='utf-8')

          # 4. Generated HTML is build output, not authoritative source. Keep assets committed and ignore generated routes.
          gi = root / '.gitignore'
          existing = gi.read_text(encoding='utf-8') if gi.exists() else ''
          rules = '\n'.join(['website/*.html', 'website/states/', 'website/law/', 'website/sources/', 'website/robots.txt', 'website/sitemap.xml'])
          if 'website/*.html' not in existing:
              gi.write_text((existing.rstrip() + '\n\n# Generated GitHub Pages output\n' + rules + '\n'), encoding='utf-8')

          # 5. Remove stale committed generated HTML/routes. Assets remain the committed website source layer.
          for path in [*root.joinpath('website').glob('*.html'), root/'website'/'robots.txt', root/'website'/'sitemap.xml']:
              path.unlink(missing_ok=True)
          for d in [root/'website'/'states', root/'website'/'law', root/'website'/'sources']:
              if d.exists():
                  import shutil; shutil.rmtree(d)

          # 6. Synchronize the two stale physical issue rows without touching other issue rows.
          p = root / 'ISSUES_REGISTER.md'
          s = p.read_text(encoding='utf-8')
          s = s.replace('| PH1-ISSUE-001 | SC/ST Act clause-level extraction and current-version verification were incomplete. | OPEN | Act baseline not yet frozen. | Final Gazette/Legislative Department index check and preserve clause extraction. |', '| PH1-ISSUE-001 | SC/ST Act clause-level extraction and current-version verification were incomplete. | CLOSED WITH QUALIFICATION | Act current-text/version question is controlled-closed, while broader later-instrument completeness remains open under PH1-ISSUE-008. | Preserve the verified 21-09-2025 consolidated Act text; do not infer absence of later subordinate instruments. |')
          s = s.replace('| PH1-ISSUE-014 | Schedule item 43 cites a 2001 disability notification while attached Annexure-II material begins with a 1986 notification. | OPEN | Controlling Annexure-II source cannot be frozen. | Locate and verify operative Gazette/Department attachment. |', '| PH1-ISSUE-014 | Schedule item 43 cites a 2001 disability notification while attached Annexure-II material begins with a 1986 notification. | CLOSED | The official Ministry-hosted Rules PDF identifies Annexure-II as the 01-06-2001 notification and treats the 1986 instrument as the earlier guideline reviewed by it. | Retain the resolution; broader final Rules source freeze remains under PH1-ISSUE-002. |')
          if '| PH1-ISSUE-001 |' in s and 'CLOSED WITH QUALIFICATION | Act current-text/version question' not in s:
              raise SystemExit('PH1-ISSUE-001 physical row did not synchronize')
          if '| PH1-ISSUE-014 |' in s and 'CLOSED | The official Ministry-hosted Rules PDF' not in s:
              raise SystemExit('PH1-ISSUE-014 physical row did not synchronize')
          p.write_text(s, encoding='utf-8')

          # 7. Synchronize README stale 33/36 statements.
          p = root / 'README.md'; s = p.read_text(encoding='utf-8')
          s = re.sub(r'33/36', '36/36', s)
          s = s.replace('Ladakh, Lakshadweep and Puducherry remain unresearched.', 'All 36 States/UTs now have substantive Phase 1 inventories. Central-law, transition and currentness residuals remain open.')
          s = s.replace('Ladakh, Lakshadweep and Puducherry remain unresearched', 'All 36 States/UTs now have substantive Phase 1 inventories')
          p.write_text(s, encoding='utf-8')

          # 8. Mark the older state-control reconciliation explicitly historical/superseded.
          p = root / 'project-state' / 'PH1_STATE_CONTROL_RECONCILIATION_2026-09-06.md'
          s = p.read_text(encoding='utf-8')
          if not s.startswith('> HISTORICAL CONTROL RECORD'):
              s = '> HISTORICAL CONTROL RECORD: superseded for current State/UT count by the 2026-09-06 cumulative Phase 1 acceptance audit and current inventory.\n\n' + s
          p.write_text(s, encoding='utf-8')

          # 9. Index central decision IDs in the cumulative decision layer by appending a controlled index section.
          p = root / 'DECISIONS_LOG.md'; s = p.read_text(encoding='utf-8')
          marker = '## Central Transition Decision Index 2026-09-06'
          if marker not in s:
              s += '\n\n' + marker + '\n\nThe following decision IDs are indexed from `project-state/CONTROL_DECISIONS_CENTRAL_TRANSITION_2026-09-06.md`: DEC-CENTRAL-2026-09-06-001, DEC-CENTRAL-2026-09-06-002, DEC-CENTRAL-2026-09-06-003, DEC-CENTRAL-2026-09-06-004. The detailed reasoning remains in the dated control record.\n'
          p.write_text(s, encoding='utf-8')

          # 10. Record the source/build-layer architecture in the Pages workflow.
          p = root / '.github' / 'workflows' / 'pages.yml'; s = p.read_text(encoding='utf-8')
          s = s.replace('permissions:\n  contents: read', 'permissions:\n  contents: read')
          p.write_text(s, encoding='utf-8')

          print('Controlled remediation edits applied.')

      - name: Validate and build corrected site
        shell: bash
        run: |
          python3 -m py_compile scripts/build_website_v2.py
          python3 -m py_compile scripts/sync_phase1_website.py
          python3 -m py_compile scripts/verify_pages_rendering_controls.py
          python3 -m py_compile scripts/validate_public_site.py
          python3 scripts/build_website_v2.py
          python3 scripts/sync_phase1_website.py
          cat website/assets/site-overrides.css >> website/assets/site.css
          python3 scripts/verify_pages_rendering_controls.py
          python3 scripts/sanitize_public_html.py
          python3 scripts/validate_public_site.py

      - name: Audit generated artifact before deployment
        shell: python
        run: |
          from pathlib import Path
          import re
          web = Path('website')
          html_files = sorted(web.rglob('*.html'))
          if len(html_files) != 90:
              raise SystemExit(f'EXPECTED 90 HTML PAGES, FOUND {len(html_files)}')
          dup = []
          for p in html_files:
              h1 = len(re.findall(r'<h1\\b', p.read_text(encoding='utf-8'), re.I))
              if h1 != 1: dup.append((str(p), h1))
          if dup:
              raise SystemExit(f'DUPLICATE_OR_MISSING_H1: {dup[:10]}')
          all_text = '\\n'.join(p.read_text(encoding='utf-8') for p in html_files)
          if '33/36' in all_text or '33<span>/36</span>' in all_text:
              raise SystemExit('STALE COUNT FOUND')
          if '36<span>/36</span>' not in all_text:
              raise SystemExit('CURRENT COUNT NOT FOUND')
          if len(list((web/'states').glob('*.html'))) != 36:
              raise SystemExit('STATE PAGE COUNT MISMATCH')
          if len(list((web/'sources').glob('*.html'))) != 36:
              raise SystemExit('SOURCE PAGE COUNT MISMATCH')
          print('90-page generated artifact audit: PASS')

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit remediation state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "control: reconcile website source and build architecture" || exit 0
          git push

      - name: Remove temporary remediation workflow from repository
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/controlled-remediation-2026-09-06.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "control: remove temporary remediation workflow" || true
          git push || true
