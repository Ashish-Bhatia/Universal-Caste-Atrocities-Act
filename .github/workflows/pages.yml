name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare repository path compatibility
        run: ln -sf DELHI.md legislation/states/DELHI_NCT.md

      - name: Validate website builders and controls
        run: |
          python3 -m py_compile scripts/build_website.py
          python3 -m py_compile scripts/build_website_v2.py
          python3 -m py_compile scripts/verify_website_source_sync.py
          python3 -m py_compile scripts/sync_phase1_website.py
          python3 -m py_compile scripts/sanitize_public_html.py
          python3 -m py_compile scripts/validate_public_site.py
          python3 -m py_compile scripts/verify_pages_rendering_controls.py

      - name: Reconcile source-ledger ID control set
        shell: bash
        run: python3 scripts/verify_website_source_sync.py | tee /tmp/source-ledger-control.txt

      - name: Preserve source-ledger control output
        uses: actions/upload-artifact@v4
        with:
          name: source-ledger-control
          path: /tmp/source-ledger-control.txt

      - name: Build research site
        run: python3 scripts/build_website_v2.py

      - name: Synchronize Phase 1 website counts
        run: python3 scripts/sync_phase1_website.py

      - name: Apply production accessibility and responsive overrides
        shell: bash
        run: cat website/assets/site-overrides.css >> website/assets/site.css

      - name: Verify Pages rendering controls
        run: python3 scripts/verify_pages_rendering_controls.py

      - name: Sanitize generated public HTML
        run: python3 scripts/sanitize_public_html.py

      - name: Validate generated site
        run: python3 scripts/validate_public_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
