name: Cleanup Generated Website Output 2026-09-06

on:
  push:
    branches:
      - remediation/website-2026-09-06

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove generated output and caches
        run: |
          git rm -f --ignore-unmatch website/*.html website/robots.txt website/sitemap.xml
          git rm -rf --ignore-unmatch website/states website/law website/sources
          git rm -f --ignore-unmatch scripts/__pycache__/build_website_v2.cpython-312.pyc
          git rm -f .github/workflows/cleanup-generated-website-2026-09-06.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "control: keep generated Pages output uncommitted"
          git push
